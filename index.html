<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BrasilBolão — o bolão do Brasileirão com a sua turma</title>
    <meta name="description" content="Palpites pelo celular, ranking automático a cada rodada e cartelas por PIX direto com o organizador. Sem planilha e sem instalar nada." />
    <link rel="canonical" href="https://brasilbolao.com.br/" />
    <meta name="theme-color" content="#060912" />

    <!-- Escudo em SVG inline: o projeto não tem pasta public, e um data URI
         evita mais um arquivo só para o ícone da aba. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 2 41 7v18c0 10-7 17.5-17 21C14 42.5 7 35 7 25V7L24 2z' fill='%23008542' stroke='%23FFD700' stroke-width='2'/%3E%3Ccircle cx='24' cy='23' r='8.4' fill='none' stroke='%23FFD700' stroke-width='1.8'/%3E%3Cpath d='M24 15.2l4.6 3.4-1.8 5.5h-5.6l-1.8-5.5L24 15.2z' fill='%23FFD700'/%3E%3C/svg%3E" />

    <!-- Prévia do link no WhatsApp.
         Este cartão é a primeira impressão de quem recebe o convite do bolão,
         muitas vezes antes de abrir qualquer coisa. Dois cuidados:
         1. IMAGEM. Sem og:image o WhatsApp mostra um cartão só de texto, que
            parece link duvidoso. A imagem fica em /public/preview.png e é
            gerada por scripts/gerar-preview.py, para poder ser refeita.
         2. TEXTO PARA QUEM RECEBE. A descrição antiga falava com o organizador
            ("você cria o bolão em dois minutos"), mas quem recebe o link quase
            sempre é participante — e lia uma promessa que não era para ele. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrasilBolão" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://brasilbolao.com.br/" />
    <meta property="og:title" content="BrasilBolão — o bolão do Brasileirão com a sua turma" />
    <meta property="og:description" content="Palpites pelo celular, ranking automático a cada rodada e cartelas por PIX direto com o organizador. Sem planilha e sem instalar nada." />
    <meta property="og:image" content="https://brasilbolao.com.br/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="BrasilBolão — o bolão do Brasileirão, do jeito fácil" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrasilBolão — o bolão do Brasileirão com a sua turma" />
    <meta name="twitter:description" content="Palpites pelo celular, ranking automático a cada rodada e cartelas por PIX direto com o organizador." />
    <meta name="twitter:image" content="https://brasilbolao.com.br/preview.png" />
  </head>

    <div id="root"></div>

  </body>
</html>
